<section>
    <h2>Execution Time</h2>
    <p>Total runtime of a program. Measured using MPI_Wtime() or system timers.</p>

    <h2>Speedup</h2>
    <p>S = T1 / Tp</p>

    <h2>Efficiency</h2>
    <p>E = S / P</p>

    <h2>FLOPS</h2>
    <p>Floating-point operations per second.</p>

    <h2>Cache Miss Rate</h2>
    <p>Indicates memory efficiency and performance bottlenecks.</p>
